name: Trail Status Cron

on:
  schedule:
    - cron: '5-59/10 * * * *'   # batch 1 → :05,:15,:25,:35,:45,:55
    - cron: '6-59/10 * * * *'   # batch 2 → :06,:16,:26,:36,:46,:56
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch trail statuses and update KV
        run: |
          case "${{ github.event.schedule }}" in
            "5-59/10 * * * *") node scripts/update-trail-status.js 1 ;;
            "6-59/10 * * * *") node scripts/update-trail-status.js 2 ;;
            *)                 node scripts/update-trail-status.js ;;
          esac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
